apiVersion: v2
name: async-long-request-proxy
description: A Helm chart for the Async Long Request Proxy API and Worker
type: application
version: 0.1.0
appVersion: '1.0.0'

dependencies:
  - name: postgresql
    version: '18.8.13'
    repository: 'https://charts.bitnami.com/bitnami'
    condition: postgresql.enabled
  - name: redis
    version: '28.0.12'
    repository: 'https://charts.bitnami.com/bitnami'
    condition: redis.enabled
