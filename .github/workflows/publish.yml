name: Publish to GHCR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable pnpm

      # Guard against tagging a hotfix branch and accidentally publishing it as a release.
      # Also enforces that package.json version is bumped before the tag is pushed.
      - name: Check if tag is on main and matches package.json
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Tag is not on the main branch. Aborting release."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.2.4

      - name: Package and Push Helm Chart
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Updating Helm chart dependencies"
          helm dependency update ./deploy/helm/async-long-request-proxy

          echo "Packaging Helm chart version $TAG_VERSION"
          helm package ./deploy/helm/async-long-request-proxy --version "$TAG_VERSION" --app-version "$TAG_VERSION"

          echo "Pushing Helm chart to GHCR"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push async-long-request-proxy-${TAG_VERSION}.tgz oci://ghcr.io/$OWNER_LC/charts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          pnpm exec conventional-changelog -p conventionalcommits -r 1 -n ./changelog.config.mjs --stdout | \
            gh release create "${GITHUB_REF_NAME}" \
            async-long-request-proxy-${TAG_VERSION}.tgz \
            --verify-tag \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes-file -
